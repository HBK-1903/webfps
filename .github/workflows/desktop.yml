name: desktop

# Builds the installable desktop app for all three platforms.
#
# This exists because a Windows .exe cannot be cross-built from Linux without
# Wine, and a macOS .dmg cannot be built anywhere but macOS. CI gives us one
# native runner per target, which is how real projects ship this.
#
# Manual only (workflow_dispatch) so a push does not burn CI minutes on a build
# that most commits do not need. Artifacts land in the run summary; tag a release
# to attach them to a GitHub Release.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Platform to build'
        type: choice
        options: [all, windows, macos, linux]
        default: all
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            artifact: windows
          - os: macos-latest
            target: macos
            artifact: macos
          - os: ubuntu-latest
            target: linux
            artifact: linux
    runs-on: ${{ matrix.os }}
    # Skip the platforms the user did not ask for on a manual run.
    if: |
      github.event_name == 'push' ||
      inputs.target == 'all' ||
      inputs.target == matrix.target
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The game itself must be green before we wrap it in a shell.
      - run: npm run build
      - run: npm run icons

      - name: Package
        run: npx electron-builder --publish never
        env:
          # No signing certificates in CI: unsigned builds are expected and
          # documented in the README (SmartScreen will warn on first run).
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ''

      - uses: actions/upload-artifact@v4
        with:
          name: sifir-nokta-${{ matrix.artifact }}
          path: |
            dist-app/*.exe
            dist-app/*.dmg
            dist-app/*.AppImage
            dist-app/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
